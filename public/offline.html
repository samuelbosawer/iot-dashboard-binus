<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1e3a8a">
    <title>Offline · Taman Pintar IoT</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
            text-align: center;
            background: linear-gradient(135deg, #2563eb, #1e40af 55%, #1e3a8a);
        }
        main { max-width: 360px; }
        img { width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 12px 30px rgb(15 23 42 / 0.35); }
        h1 { margin: 24px 0 8px; font-size: 1.5rem; }
        p { margin: 0; color: #dbeafe; line-height: 1.6; }
        button {
            margin-top: 28px;
            padding: 12px 24px;
            border: 0;
            border-radius: 12px;
            background: #fff;
            color: #1d4ed8;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <img src="/icon-192.png" alt="Taman Pintar IoT">
        <h1>Kamu sedang offline</h1>
        <p>Data sensor realtime butuh koneksi internet. Periksa jaringanmu lalu coba lagi.</p>
        <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
    <script>
        window.addEventListener('online', () => location.reload());
    </script>
</body>
</html>
